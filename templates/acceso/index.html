<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Dulces Deseos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<div class="container d-flex justify-content-center align-items-center vh-100">
    <div class="card shadow-sm p-4" style="width: 100%; max-width: 400px; border-radius: 12px;">
        <div class="text-center mb-4">
            <h3 class="fw-bold" style="color: #5d4037;">Dulces Deseos</h3>
            <p class="text-muted">Repostería</p>
        </div>
        <form action="/login" method="POST">
            <div class="mb-3">
                <label for="correo" class="form-label">Correo Electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.com" required>
            </div>
            <div class="mb-3">
                <label for="clave" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="clave" required>
            </div>
            <div class="d-grid gap-2 mt-4">
                <button type="submit" class="btn text-white fw-semibold" style="background-color: #8d6e63;">Ingresar</button>
            </div>
            <div class="text-center mt-3">
                <small class="text-muted">¿No tienes cuenta? <a href="#" style="color: #5d4037;">Regístrate aquí</a></small>
            </div>
        </form>
    </div>
</div>

</body>
</html>
