<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Pedido - Dulces Deseos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark mb-4" style="background-color: #5d4037;">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Dulces Deseos · Repostería</span>
    </div>
</nav>

<div class="container mb-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4">
        <h4 class="fw-bold mb-3" style="color: #4e342e;">Confirmar Pedido</h4>
        <hr>
        <form>
            <div class="mb-3">
                <label class="form-label fw-semibold">Postre Seleccionado</label>
                <input type="text" class="form-control" value="Pastel de Chocolate ($15.00)" disabled>
            </div>
            
            <div class="row mb-3">
                <div class="col-6">
                    <label for="cantidad" class="form-label fw-semibold">Cantidad</label>
                    <input type="number" class="form-control" id="cantidad" value="1" min="1">
                </div>
                <div class="col-6">
                    <label for="fecha" class="form-label fw-semibold">Fecha de Entrega</label>
                    <input type="date" class="form-control" id="fecha">
                </div>
            </div>

            <div class="mb-3">
                <label for="direccion" class="form-label fw-semibold">Dirección de Entrega / Notas</label>
                <textarea class="form-control" id="direccion" rows="3" placeholder="Ej. Calle principal, casa color blanco..."></textarea>
            </div>

            <div class="alert alert-secondary d-flex justify-content-between align-items-center mt-4">
                <span class="fw-bold">Total a pagar:</span>
                <span class="fs-5 fw-bold text-success">$15.00</span>
            </div>

            <div class="d-flex justify-content-end gap-2">
                <button type="button" class="btn btn-outline-secondary">Cancelar</button>
                <button type="submit" class="btn text-white" style="background-color: #5d4037;">Confirmar Pedido</button>
            </div>
        </form>
    </div>
</div>

</body>
</html>
