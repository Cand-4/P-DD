<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realizar Pedido - Dulces Deseos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark mb-4" style="background-color: #5d4037;">
    <div class="container">
        <span class="navbar-brand mb-0 h1">Dulces Deseos · Repostería</span>
        <a href="/cliente" class="btn btn-sm btn-outline-light">Volver al Catálogo</a>
    </div>
</nav>

<div class="container mb-5" style="max-width: 600px;">
    <div class="card shadow-sm border-0 p-4">
        <h4 class="fw-bold mb-3" style="color: #4e342e;">Confirmar Pedido</h4>
        <hr>
        
        <!-- el formulario envia los datos por post a /pedido/guardar -->
        <form action="/pedido/guardar" method="POST">
            
            <!-- campo oculto para enviar el id del postre a MySQL -->
            <input type="hidden" name="postre_id" value="{{ pastel.0 }}">
            
            <div class="mb-3">
                <label class="form-label fw-semibold">Postre Seleccionado</label>
                <!-- muestra el nombre y precio que vienen de la base de datos -->
                <input type="text" class="form-control bg-light" value="{{ pastel.1 }} (${{ pastel.3 }})" readonly>
            </div>
            
            <div class="row mb-3">
                <div class="col-6">
                    <label for="cantidad" class="form-label fw-semibold">Cantidad</label>
                    <input type="number" name="cantidad" class="form-control" id="cantidad" value="1" min="1" required>
                </div>
                <div class="col-6">
                    <label for="fecha" class="form-label fw-semibold">Fecha de Entrega</label>
                    <input type="date" name="fecha" class="form-control" id="fecha" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label for="direccion" class="form-label fw-semibold">Dirección de Entrega</label>
                <input type="text" name="direccion" class="form-control" id="direccion" placeholder="Ej: Av. Principal y Calle 2" required>
            </div>
            
            <button type="submit" class="btn w-100 text-white fw-bold py-2" style="background-color: #8d6e63;">Confirmar y Enviar Pedido</button>
        </form>
    </div>
</div>

</body>
</html>
